name: Ejecucion CI
on:
  pull_request:
#Se debe elegir las ramas de Develop, Stagint y Main/Master
    branches:
      - develops
      - stagings
      - masters
#Se puede agregar que se pueda ejecutar manualmente
  workflow_dispatch:
    inputs:
      cloud_organization:
        required: true
        type: string
      tf_workspace:
        required: true
        type: string
      config_directory:
        required: true
        type: string

# Se pueden agregar variables de ambiente para reutilizarlas en los pasos
env:
  TF_CLOUD_ORGANIZATION: "${{ inputs.cloud_organization }}"
  TF_API_TOKEN: "${{ secrets.tf_api_token }}"
  TF_WORKSPACE: "${{ inputs.tf_workspace }}"
  CONFIG_DIRECTORY: "${{ inputs.config_directory}}"


jobs: 
# Se pueden tener pasos donde se haga escaneos de seguridad, en este caso se tiene Checkmarx y Tenable
  checkmarx-analysis:
    uses: BUS-Analitica/DevSecOpsPipelinesTemplates/.github/workflows/checkmarx-workflow.yml@main
    with:
      workflows-ref: main
      tags: DevSecOps,Journey3.0,NombreProyecto
      threshold: sast-high=10;sca-high=10
    secrets:
      cx_client_id: ${{ secrets.CX_CLIENT_ID }}
      cx_client_secret: ${{ secrets.CX_SECRET }}

  tenable-analysis:
    uses: BUS-Analitica/DevSecOpsPipelinesTemplates/.github/workflows/tenable-workflows.yml@main
    needs: [checkmarx-analysis]
    with:
      failminseverity: low
      workingdirpython: Tenable_Feedback/
      filename: feedback.py
      organization: OXXOSWD
      project: Integration-ServiceNow
    secrets:
      tenable_api_token: ${{ secrets.PRUEBA_DEVSECOPS }}
      azure_token: ${{ secrets.AZTOKEN }}

# Si los escaneos son exitosos se puede proceder a ejecutar el plan de Terraform
# En el CI se puede dejar el puro PLAN para revisar que no haya errores y que va a generar
  terraform:
    name: "Terraform Plan"
    needs: [checkmarx-analysis, tenable-analysis]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload Configuration
        uses: hashicorp/tfc-workflows-github/actions/upload-configuration@v1.0.0
        id: plan-upload
        with:
          workspace: ${{ env.TF_WORKSPACE }}
          directory: ${{ env.CONFIG_DIRECTORY }}
          speculative: true      

      - name: Create Plan Run
        uses: hashicorp/tfc-workflows-github/actions/create-run@v1.0.0
        id: plan-run
        with:
          workspace: ${{ env.TF_WORKSPACE }}
          configuration_version: ${{ steps.plan-upload.outputs.configuration_version_id }}
          plan_only: true

      - name: Get Plan Output
        uses: hashicorp/tfc-workflows-github/actions/plan-output@v1.0.0
        id: plan-output
        with:
          plan: ${{ fromJSON(steps.plan-run.outputs.payload).data.relationships.plan.data.id }}
